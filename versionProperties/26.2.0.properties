# 26.2.0 version
java_version=25
minecraft_version=26.2
parchment_version=1.21:2024.07.28
# Forge matches this against the version FML reports for the "minecraft" mod, which is 26.2 and
# not 26.2.0, so the list has to spell the version the way the loader sees it.
compatible_minecraft_versions=["26.2"]
accessWidenerVersion=26_1
builds_for=forge
# forge re-enabled for the MinecraftForge 26.2 port

# Netty
netty_version=4.1.97.Final

# LWJGL
lwjgl_version=3.4.1

# Fabric loader
fabric_loader_version=0.19.3
fabric_api_version=0.149.0+26.2
    modmenu_version=20.0.1
    starlight_version_fabric=
    phosphor_version_fabric=
    lithium_version=
    sodium_version=
    iris_version=1.11.1+26.2-fabric
    bclib_version=
    immersive_portals_version=
    canvas_version=
    
    # vertigo - prevents DH from seeing the full chunk, causing holes
    fabric_incompatibility_list={ "vertigo": "*" }
    fabric_recommend_list={}

    # Fabric mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    enable_mod_menu=1
    enable_starlight=0
    enable_phosphor=0
    enable_sodium=0
    enable_lithium=0
    enable_iris=1
    enable_bclib=0
    enable_immersive_portals=0
    enable_canvas=0

# Forge loader
forge_version=65.1.0

    # Forge mod versions
    # TerraForged / TerraFirmaCraft / Oculus have no MC 26.2 builds, so they stay disabled.
    # Iris on Forge 26.2 uses the mod id "iris" (see IrisAccessor), not the old "oculus" fork.
    terraforged_version=
    oculus_version=
    enable_terraforged=0
    enable_terrafirmacraft=0
    enable_oculus=0

# NeoForge loader
neoforge_version=1-beta
neoforge_version_range=[*,)

    # NeoForge mod versions
    neo_iris_version=1.11.2+26.1-neoforge
    
    # (Neo)Forge mod run
    # 0 = Don't enable and don't run
    # 1 = Can be referenced in code but doesn't run
    # 2 = Can be referenced in code and runs in client
    neo_enable_iris=1
